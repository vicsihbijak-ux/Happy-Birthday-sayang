    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background-color: #fff0f5;
        }
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 60;
        }
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 55px;
            height: 70px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: flyUp linear infinite;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background-color: rgba(180, 180, 180, 0.8);
        }
        @keyframes flyUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.95;
            }
            50% {
                transform: translateY(-55vh) translateX(25px) rotate(6deg);
                opacity: 0.95;
            }
            100% {
                transform: translateY(-110vh) translateX(-25px) rotate(-6deg);
                opacity: 0;
            }
        }

        #notification-popup {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 92%;
            max-width: 420px;
        }
        #notification-popup.show {
            top: 16px;
        }

        .script-font {
            font-family: 'Dancing Script', cursive;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.8)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 105, 180, 1)); }
        }
        .glow-effect {
            animation: pulseGlow 2s infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95) rotate(-2deg); }
        }
        .candle-flame {
            animation: flicker 0.5s infinite alternate;
        }
